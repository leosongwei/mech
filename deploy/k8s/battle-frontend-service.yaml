apiVersion: v1
kind: Service
metadata:
  name: mech-battle-frontend
  namespace: mech
  labels:
    app.kubernetes.io/name: mech
    app.kubernetes.io/component: battle-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mech
    app.kubernetes.io/component: battle-frontend
  ports:
